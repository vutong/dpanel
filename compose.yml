services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-nginx
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps:/var/www/apps:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      dpanel:
        condition: service_healthy
      php-fpm:
        condition: service_started
    networks:
      - stack

  dpanel:
    build:
      context: ./infra/docker/node
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-nuxt
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1024m
    env_file: .env
    environment:
      STACK_ROOT: /opt/stack
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    volumes:
      - ./apps/${PANEL_DOMAIN}:/app
      - .:/opt/stack
      - ./logs/node:/var/log/node
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - stack

  php-fpm:
    build:
      context: ./infra/docker/php
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-php
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./apps:/var/www/apps
      - ./infra/docker/php/config:/usr/local/etc/php/conf.d/custom:ro
      - ./logs/php:/var/log/php
    networks:
      - stack

  mariadb:
    image: mariadb:11
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb/volume:/var/lib/mysql
      - ./logs/mariadb:/var/log/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - stack

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-pma
    restart: unless-stopped
    env_file: .env
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost/mariadb/}
      UPLOAD_LIMIT: 64M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - stack

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --requirepass $${REDIS_PASSWORD}
      --dir /data
      --appendonly yes"
    env_file: .env
    volumes:
      - ./data/redis/persistence:/data
      - ./logs/redis:/var/log/redis
    networks:
      - stack

  cache-collector:
    build:
      context: ./infra/docker/collector
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dpanel}-cache-collector
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      STACK_ROOT: /opt/stack
      DPANEL_PRESENCE_TTL_MS: ${DPANEL_PRESENCE_TTL_MS:-45000}
      DPANEL_CACHE_STATS_INTERVAL_ACTIVE_MS: ${DPANEL_CACHE_STATS_INTERVAL_ACTIVE_MS:-8000}
      DPANEL_CACHE_STATS_INTERVAL_IDLE_MS: ${DPANEL_CACHE_STATS_INTERVAL_IDLE_MS:-60000}
      DPANEL_COLLECTOR_HEALTH_MAX_AGE_SEC: ${DPANEL_COLLECTOR_HEALTH_MAX_AGE_SEC:-600}
    volumes:
      - .:/opt/stack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "bash", "/opt/stack/infra/scripts/cache-collector-health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      dpanel:
        condition: service_healthy
    networks:
      - stack

networks:
  stack:
    driver: bridge
