# dpanel-managed jails — log paths under /opt/stack on VPS host
[nginx-dpanel-login]
enabled = true
port = http,8443
filter = nginx-dpanel-login
logpath = /opt/stack/logs/nginx/access.log
maxretry = 5
findtime = 600
bantime = 3600

[nginx-php-exploit]
enabled = true
port = http,8443
filter = nginx-php-exploit
logpath = /opt/stack/logs/nginx/access.log
maxretry = 10
findtime = 600
bantime = 7200
